name: ai-social

services:
  web:
    build:
      context: .
      target: runtime
    command: uvicorn ai_social.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.1-alpine
    volumes:
      - redisdata:/data

  celery:
    container_name: celery
    build: .
    command: celery -A ai_social worker -l info
    volumes:
      - .:/app
      - /app/.venv
      - ./data/web:/vol/web
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  celery-beat:
    container_name: celery-beat
    build: .
    command: celery -A ai_social beat -l info
    volumes:
      - .:/app
      - /app/.venv
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


volumes:
  postgres_data:
  redisdata:
